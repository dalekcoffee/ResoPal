<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Resopal logo">
  <defs>
    <linearGradient id="rp-gold" x1="20" y1="14" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9B87A"/>
      <stop offset=".45" stop-color="#A98146"/>
      <stop offset=".72" stop-color="#E0C48C"/>
      <stop offset="1" stop-color="#8A6A39"/>
    </linearGradient>
    <radialGradient id="rp-disc" cx="50" cy="46" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1B22"/>
      <stop offset="1" stop-color="#050A0D"/>
    </radialGradient>
    <filter id="rp-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- card ground -->
  <circle cx="50" cy="50" r="50" fill="#16110C"/>
  <circle cx="50" cy="50" r="47.2" fill="none" stroke="url(#rp-gold)" stroke-width="2.2"/>
  <circle cx="50" cy="50" r="43.6" fill="none" stroke="url(#rp-gold)" stroke-width=".7" opacity=".75"/>

  <!-- deco diamond frame -->
  <path d="M50 11 L89 50 L50 89 L11 50 Z" fill="none" stroke="url(#rp-gold)" stroke-width="1.9" stroke-linejoin="miter"/>
  <path d="M50 17.5 L82.5 50 L50 82.5 L17.5 50 Z" fill="none" stroke="url(#rp-gold)" stroke-width=".65" opacity=".7"/>

  <!-- deco corner ticks -->
  <g stroke="url(#rp-gold)" stroke-width="1.5" stroke-linecap="round" opacity=".85">
    <path d="M50 4.5v5M50 90.5v5M4.5 50h5M90.5 50h5"/>
  </g>

  <!-- glowing disc -->
  <circle cx="50" cy="50" r="25" fill="url(#rp-disc)"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#56D8EA" stroke-width="2.6" filter="url(#rp-glow)"/>

  <!-- R monogram, riding over the disc edge -->
  <g transform="translate(50,50) scale(.9) translate(-52.75,-50)">
    <path fill="url(#rp-gold)" fill-rule="evenodd"
      d="M31.7 24.2H53.8C64.6 24.2 71.7 30.4 71.7 39.6C71.7 46.7 67.5 52.1 60.4 54.2L73.8 75.8H61.7L49.6 55.8H42.9V75.8H31.7ZM42.9 33.8V45.8H52.9C57.5 45.8 60.4 43.3 60.4 39.6C60.4 35.8 57.9 33.8 52.9 33.8Z"/>
  </g>
</svg>
