# Generate the pre-rotated copies of every landscape printing and commit them.
#
# This exists because the job needs three things at once: Palify's images, an
# image library, and a checkout to commit into. A browser has the first, a
# cloud agent has the third, neither has all of them. A runner does.
#
# Run it from the Actions tab (Run workflow). It is also triggered by a change to
# any data/pool-*.json, since a new set is exactly when new landscape printings
# appear.
name: Rotate landscape printings

on:
  workflow_dispatch:
    inputs:
      codes:
        description: 'Extra card codes to include, comma separated (for a set not yet snapshotted)'
        required: false
        default: ''
  push:
    # main only. Without this it fires on every feature branch that touches the
    # script and commits generated images back onto it, which is a surprise even
    # when the output is right.
    branches: [main]
    paths:
      - 'data/pool-*.json'
      - 'tools/rotate-landscape.mjs'

permissions:
  contents: write

concurrency:
  group: rotate-landscape
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp
        run: npm install --no-save sharp@0.35.4

      # The direction constant has been wrong twice, and a wrong one still
      # produces perfectly valid portrait images - just upside down. Check it
      # before writing 78 files.
      - name: Check the rotation direction
        run: node tools/test-rotate.mjs

      - name: Rotate
        run: node tools/rotate-landscape.mjs --codes "${{ inputs.codes }}"

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain assets/rot)" ]; then
            echo "assets/rot is already up to date - nothing to commit"
            exit 0
          fi
          git config user.name  'Dalek'
          git config user.email 'dalek@users.noreply.github.com'
          git add assets/rot
          git commit -m "Rotate the landscape printings

          Generated by tools/rotate-landscape.mjs. Which cards are turned is
          decided by measuring each image, not by the landscape array in
          data/pool-*.json, so a snapshot that is stale or wrong cannot leave a
          card sideways in-world."
          git push
